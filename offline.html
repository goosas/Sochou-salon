<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SOCHOU HAIR BEAUTY SALON | Hors ligne</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin:  0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1A1A1A;
      color: #FFFFFF;
      font-family: "Poppins", Arial, sans-serif;
      padding: 1.25rem;
      text-align: center;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      background: #FAFAFA;
      color: #333333;
      border-radius: 24px;
      padding: 2.5rem 1.75rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .offline-card img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 1rem;
    }
    .offline-card h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.4rem;
      color: #1A1A1A;
      margin: 0 0 0.5rem;
    }
    .offline-card p {
      font-size: 0.95rem;
      color: #6F6F6F;
      margin:  0 1.5rem;
    }
    .offline-card a {
      display: inline-block;
      background: #D4AF37;
      color: #1A1A1A;
      text-decoration: none;
      font-weight: 600;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      transition: background 220ms ease;
    }
    .offline-card a:hover {
      background: #E8C46A;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="images/logo/logo.png" alt="SOCHOU HAIR BEAUTY SALON">
    <h1>Connexion Internet indisponible</h1>
    <p>Certaines informations peuvent ne pas être à jour. Reconnectez-vous à Internet puis réessayez pour accéder aux dernières données du salon.</p>
    <a href="index.html">Réessayer</a>
  </div>
</body>
</html>
